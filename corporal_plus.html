<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corporal Plus Test</title>
<style>
  :root{
    --bg:#eef0f4;
    --sidebar-bg:#20242c;
    --sidebar-fg:#e7e9ee;
    --accent:#4a6fa5;
    --accent-hover:#3b5c8a;
    --card:#ffffff;
    --text:#20242c;
    --muted:#6b7280;
    --border:#dfe3ea;
    --danger:#b3412f;
    --hover:rgba(226,146,74,.16);
    --hover-border:rgba(226,146,74,.35);
    --good:#2f7d4f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:"Segoe UI", Arial, sans-serif;
    font-size:20px;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  .app{
    display:flex;
    height:100vh;
    width:100vw;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;
    flex-shrink:0;
    background:var(--sidebar-bg);
    color:var(--sidebar-fg);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
  }
  .brand{
    font-size:24px;
    font-weight:700;
    letter-spacing:.3px;
    margin-bottom:4px;
  }
  .brand small{
    display:block;
    font-size:13px;
    font-weight:400;
    color:#9aa1ad;
    margin-top:2px;
  }
  .nav-group{
    margin-top:24px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .nav-btn{
    text-align:left;
    background:transparent;
    border:1px solid transparent;
    color:var(--sidebar-fg);
    padding:10px 12px;
    border-radius:8px;
    cursor:pointer;
    font-size:20px;
    line-height:1.35;
    transition:background .15s, border-color .15s;
  }
  .nav-btn span{
    display:block;
    font-size:14px;
    color:#9aa1ad;
    margin-top:1px;
  }
  .nav-btn:hover{
    background:var(--hover);
    border-color:var(--hover-border);
  }
  .nav-btn.active{
    background:var(--accent);
    border-color:var(--accent);
  }
  .nav-btn.active span{ color:#dfe6f2; }
  .nav-divider{
    height:1px;
    background:#333844;
    margin:20px 0;
  }
  .sidebar-footer{
    margin-top:auto;
    font-size:13px;
    color:#6b7280;
  }

  /* ---------- Main ---------- */
  .main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-width:0;
    height:100vh;
  }
  .instruction-banner{
    display:none;
    align-items:center;
    justify-content:center;
    position:relative;
    padding:14px 60px;
    font-size:20px;
    color:#3a3f4a;
    background:var(--bg);
    text-align:center;
    min-height:24px;
  }
  .instruction-banner.visible{ display:flex; }
  .close-btn{
    position:absolute;
    right:24px;
    top:50%;
    transform:translateY(-50%);
    background:transparent;
    border:none;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    color:#20242c;
    padding:4px 8px;
  }
  .close-btn:hover{ color:var(--danger); }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:16px;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .status-bar{
    display:flex;
    align-items:center;
    gap:28px;
    font-size:20px;
    font-weight:600;
    color:var(--text);
  }
  .status-bar #statusErrors{
    color:var(--danger);
  }
  .grid3x3{
    width:min(540px, 78vmin);
    height:min(540px, 78vmin);
    background:#fff;
    box-shadow:0 4px 24px rgba(0,0,0,0.10);
    border-radius:2px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    position:relative;
  }
  .cell{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-arrow{ width:56%; height:60%; }
  .icon-cross{ width:53%; height:53%; }

  .overlay{
    position:absolute;
    inset:0;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:40px;
  }
  .overlay-content{ max-width:460px; }
  .overlay h2{ margin:0 0 12px; font-size:26px; }
  .overlay p{ font-size:20px; color:#454b57; line-height:1.55; margin:0 0 8px; }
  .overlay .countdown-number{
    font-size:96px;
    font-weight:700;
    color:var(--accent);
  }
  .btn{
    display:inline-block;
    margin-top:18px;
    padding:11px 26px;
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:20px;
    cursor:pointer;
    transition:background .15s;
  }
  .btn:hover{ background:var(--accent-hover); }
  .btn.secondary{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
    margin-left:10px;
  }
  .btn.secondary:hover{ background:#eef3fa; }

  .summary-stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px 20px;
    text-align:left;
    margin:18px 0;
    font-size:18px;
  }
  .score-box{
    margin:14px 0 4px;
    padding:10px 0;
    border-top:1px solid var(--border);
    border-bottom:1px solid var(--border);
  }
  .score-box b{ display:block; font-size:44px; font-weight:700; color:var(--accent); line-height:1.1; }
  .score-box span{ font-size:15px; color:var(--muted); }
  .sub-note{ font-size:15px !important; color:var(--muted) !important; margin:0 0 6px !important; }
  .warn-note{ font-size:15px !important; color:var(--danger) !important; margin:0 0 6px !important; }
  .summary-stats div b{ display:block; font-size:24px; color:var(--text); }
  .summary-stats div span{ color:var(--muted); font-size:15px; }

  .trials-config{ margin:16px 0 6px; text-align:left; }
  .trials-config label{ display:block; font-size:16px; color:#454b57; margin-bottom:6px; }
  .stepper{ display:flex; align-items:stretch; width:150px; }
  .stepper input{
    width:90px;
    font-size:20px;
    padding:8px 10px;
    border:1px solid var(--border);
    border-right:none;
    border-radius:6px 0 0 6px;
    text-align:center;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{
    -webkit-appearance:none;
    margin:0;
  }
  .stepper-buttons{ display:flex; flex-direction:column; }
  .stepper-buttons button{
    flex:1;
    width:36px;
    border:1px solid var(--border);
    background:#f4f6f9;
    cursor:pointer;
    font-size:11px;
    line-height:1;
    padding:0;
  }
  .stepper-buttons button:first-child{ border-radius:0 6px 0 0; border-bottom:none; }
  .stepper-buttons button:last-child{ border-radius:0 0 6px 0; }
  .stepper-buttons button:hover{ background:#e8ecf2; }

  /* ---------- Results view ---------- */
  .results-view{
    flex:1;
    padding:32px 40px;
    overflow-y:auto;
  }
  .results-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .results-header h2{ margin:0; }
  .results-actions button{
    margin-left:8px;
  }
  table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    font-size:20px;
    box-shadow:0 1px 6px rgba(0,0,0,0.06);
  }
  th,td{
    padding:9px 12px;
    text-align:left;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  th{
    background:#f4f6f9;
    font-weight:600;
    color:#454b57;
  }
  tr:last-child td{ border-bottom:none; }
  .row-btn{
    background:transparent;
    border:1px solid var(--border);
    border-radius:5px;
    padding:4px 9px;
    font-size:16px;
    cursor:pointer;
    color:var(--accent);
  }
  .row-btn:hover{ background:#eef3fa; }
  #noResultsMsg{ color:var(--muted); margin-top:20px; }

  .btn-outline{
    background:#fff;
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 16px;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
  }
  .btn-outline:hover{ background:#f4f6f9; }
  .btn-outline.danger{ color:var(--danger); border-color:#e3c3bd; }
  .btn-outline.danger:hover{ background:#fbf0ee; }
</style>
</head>
<body>

<!-- Icon definitions -->
<svg style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <symbol id="icon-arrow" viewBox="0 0 120 130">
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="15,15 60,55 105,15" stroke="#2b2b2b" stroke-width="20"/>
        <polyline points="15,43 60,83 105,43" stroke="#2b2b2b" stroke-width="20"/>
        <polyline points="15,71 60,111 105,71" stroke="#2b2b2b" stroke-width="20"/>
        <polyline points="15,15 60,55 105,15" stroke="#9a9a9a" stroke-width="14"/>
        <polyline points="15,43 60,83 105,43" stroke="#9a9a9a" stroke-width="14"/>
        <polyline points="15,71 60,111 105,71" stroke="#9a9a9a" stroke-width="14"/>
      </g>
    </symbol>
    <symbol id="icon-cross" viewBox="0 0 120 120">
      <g stroke-linecap="round" stroke-linejoin="round" fill="none">
        <polyline points="20,20 100,100" stroke="#2b2b2b" stroke-width="20"/>
        <polyline points="100,20 20,100" stroke="#2b2b2b" stroke-width="20"/>
        <polyline points="20,20 100,100" stroke="#9a9a9a" stroke-width="14"/>
        <polyline points="100,20 20,100" stroke="#9a9a9a" stroke-width="14"/>
      </g>
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
        <line x1="54" y1="60" x2="66" y2="60"/>
        <line x1="60" y1="54" x2="60" y2="66"/>
      </g>
    </symbol>
  </defs>
</svg>

<div class="app">
  <aside class="sidebar">
    <div class="brand">Corporal Plus<small>Aufmerksamkeits-Test</small></div>
    <div class="nav-group">
      <button class="nav-btn" data-test="1">Test 1<span>Intrinsische Alertness</span></button>
      <button class="nav-btn" data-test="2">Test 2<span>Selektive Aufmerksamkeit</span></button>
      <button class="nav-btn" data-test="3">Test 3<span>Verteilte Aufmerksamkeit A</span></button>
    </div>
    <div class="nav-divider"></div>
    <button class="nav-btn" id="btn-results">Ergebnisse<span>Verlauf &amp; Export</span></button>
    <div class="sidebar-footer">Steuerung: Pfeiltasten ↑ ↓ ← →</div>
  </aside>

  <main class="main">
    <div class="instruction-banner" id="instructionBanner">
      <span id="instructionText"></span>
      <button class="close-btn" id="closeTestBtn" title="Test abbrechen" hidden>&#10005;</button>
    </div>

    <div class="stage" id="stage">
      <div class="status-bar" id="statusBar" hidden>
        <span id="statusProgress">0 / 0</span>
        <span id="statusErrors">Fehler: 0</span>
      </div>
      <div class="grid3x3" id="grid"></div>
      <div class="overlay" id="overlay">
        <div class="overlay-content">
          <h2>Willkommen</h2>
          <p>Wählen Sie links einen Test aus, um zu beginnen.</p>
        </div>
      </div>
    </div>

    <section class="results-view" id="resultsView" hidden>
      <div class="results-header">
        <h2>Ergebnisse</h2>
        <div class="results-actions">
          <button class="btn-outline" id="exportAllBtn">Alle als CSV exportieren</button>
          <button class="btn-outline danger" id="clearAllBtn">Verlauf löschen</button>
        </div>
      </div>
      <table id="resultsTable">
        <thead>
          <tr>
            <th>Datum</th>
            <th>Test</th>
            <th>Aufgaben</th>
            <th>Treffer</th>
            <th>Fehler</th>
            <th>Auslassungen</th>
            <th>Genauigkeit</th>
            <th>Ø Reaktionszeit</th>
            <th>Gesamtwert</th>
            <th>Detail</th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
      <p id="noResultsMsg" hidden>Noch keine Testergebnisse vorhanden.</p>
    </section>
  </main>
</div>

<script>
(function(){
  "use strict";

  /* ============ Konstanten ============ */
  const ARROW_KEYS = ["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"];
  const DIRECTIONS = ["up","down","left","right"];
  const KEY_FOR_DIR = {up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight"};
  const ROTATE_FOR_DIR = {down:0, up:180, left:90, right:-90};
  // Rasterindex (0-8), row = floor(i/3), col = i%3
  const CENTER_CELL = 4;
  const SIDE_MID_CELLS = {1:"up", 3:"left", 5:"right", 7:"down"}; // Kreuz-Positionen: Zelle -> Richtung/Seite
  const ALL_CELLS = [0,1,2,3,4,5,6,7,8];

  const STORAGE_KEY = "corporalPlusResults";
  // Anteil der Go-Aufgaben in Test 2 (mindestens ein Pfeil zeigt nach unten)
  const GO_RATIO = 0.5;
  // Bewertung der mittleren Reaktionszeit: <= fast => 100 Punkte, >= slow => 0 Punkte.
  // Test 2 und 3 haben groesszuegigere Schwellen (hoehere visuelle bzw. duale Anforderung).
  const RT_BOUNDS = { 1:{fast:250, slow:600}, 2:{fast:400, slow:900}, 3:{fast:500, slow:1200} };
  // Unterhalb dieser Genauigkeit gilt das Schnelligkeitsmass als nicht mehr interpretierbar
  const FEHLERTOLERANZ_GENAUIGKEIT = 50;

  const TEST_META = {
    1: {
      name: "Test 1: Intrinsische Alertness",
      trials: 64,
      instruction: "Sobald der Pfeil erscheint, mit der Taste „unten“ (↓) reagieren.",
      intro: "Auf dem Bildschirm erscheint ein nach unten zeigender Pfeil. Reagieren Sie so schnell wie möglich mit der Pfeiltaste „unten“ (↓). Reagieren Sie nicht zu früh – ein Tastendruck vor dem Pfeil beendet die Aufgabe und zählt als Fehler."
    },
    2: {
      name: "Test 2: Selektive Aufmerksamkeit",
      trials: 64,
      instruction: "Nur mit der Taste „unten“ reagieren, wenn mindestens ein Pfeil nach unten zeigt.",
      intro: "Es erscheinen gleichzeitig zwei Pfeile in zwei Feldern des 3×3-Rasters. Drücken Sie „unten“ (↓) nur, wenn mindestens einer der beiden Pfeile nach unten zeigt. Zeigen beide in andere Richtungen, reagieren Sie nicht."
    },
    3: {
      name: "Test 3: Verteilte Aufmerksamkeit A",
      trials: 64,
      instruction: "Erst die Richtung des Pfeils eingeben, dann die Position des Kreuzes.",
      intro: "Es erscheinen gleichzeitig ein Pfeil und ein Kreuz. Geben Sie zuerst die Richtung des Pfeils ein (↑ ↓ ← →), danach die Position des Kreuzes (an welcher Seite des Quadrats es steht)."
    }
  };

  /* ============ Globaler Status ============ */
  const els = {
    grid: document.getElementById("grid"),
    overlay: document.getElementById("overlay"),
    instructionBanner: document.getElementById("instructionBanner"),
    instructionText: document.getElementById("instructionText"),
    closeTestBtn: document.getElementById("closeTestBtn"),
    statusBar: document.getElementById("statusBar"),
    statusProgress: document.getElementById("statusProgress"),
    statusErrors: document.getElementById("statusErrors"),
    resultsView: document.getElementById("resultsView"),
    stage: document.getElementById("stage"),
    resultsBody: document.getElementById("resultsBody"),
    noResultsMsg: document.getElementById("noResultsMsg"),
    exportAllBtn: document.getElementById("exportAllBtn"),
    clearAllBtn: document.getElementById("clearAllBtn"),
  };

  const cellEls = [];
  for (let i=0;i<9;i++){
    const c = document.createElement("div");
    c.className = "cell";
    c.dataset.index = i;
    els.grid.appendChild(c);
    cellEls.push(c);
  }

  const run = {
    timers: [],
    onKey: null,
    resolveCurrent: null,
    aborted: false,
    testId: null,
    trialLog: [],
    liveFehler: 0,
    totalTrials: 0,
  };

  const TRIALS_CONFIG_KEY = "corporalPlusTrialConfig_v2";
  const trialsConfig = { 1: TEST_META[1].trials, 2: TEST_META[2].trials, 3: TEST_META[3].trials };
  (function loadTrialsConfig(){
    try{
      const raw = localStorage.getItem(TRIALS_CONFIG_KEY);
      if (raw){
        const saved = JSON.parse(raw);
        Object.keys(saved).forEach(k=>{
          const n = Number(saved[k]);
          if (n > 0) trialsConfig[k] = n;
        });
      }
    }catch(e){ /* ignore */ }
  })();
  function saveTrialsConfig(){
    try{ localStorage.setItem(TRIALS_CONFIG_KEY, JSON.stringify(trialsConfig)); }catch(e){ /* ignore */ }
  }

  function clearTimers(){
    run.timers.forEach(t=>clearTimeout(t));
    run.timers = [];
  }
  function after(ms, fn){
    const t = setTimeout(fn, ms);
    run.timers.push(t);
    return t;
  }
  function sleep(ms){
    return new Promise(resolve=>{ after(ms, resolve); });
  }
  function now(){ return performance.now(); }

  document.addEventListener("keydown", function(e){
    if (ARROW_KEYS.includes(e.key)){
      e.preventDefault();
      if (e.repeat) return;   // Auto-Repeat beim Gedrueckthalten nicht als Eingabe werten
      if (typeof run.onKey === "function") run.onKey(e.key, now());
    }
  });

  function randInt(min, max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function randChoice(arr){ return arr[randInt(0, arr.length-1)]; }
  function randomDirection(){ return randChoice(DIRECTIONS); }
  function twoDistinctCells(){
    const a = randInt(0,8);
    let b = randInt(0,8);
    while(b===a) b = randInt(0,8);
    return [a,b];
  }
  // Feste Go/NoGo-Quote statt zufaelliger Haeufung
  function buildGoSequence(total){
    const nGo = Math.round(total * GO_RATIO);
    const arr = [];
    for (let i=0;i<total;i++) arr.push(i < nGo);
    for (let i=arr.length-1;i>0;i--){
      const j = randInt(0,i);
      const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }
  function arrowPairForCondition(isGo){
    const other = DIRECTIONS.filter(d=>d!=="down");
    if (!isGo) return [randChoice(other), randChoice(other)];
    if (Math.random() < 0.25) return ["down","down"];
    return (Math.random() < 0.5) ? ["down", randChoice(other)] : [randChoice(other), "down"];
  }

  /* ============ Rendering ============ */
  function clearGrid(){
    cellEls.forEach(c=>{ c.innerHTML = ""; });
  }
  function renderArrow(cellIndex, direction){
    cellEls[cellIndex].innerHTML =
      '<svg class="icon-arrow" style="transform:rotate('+ROTATE_FOR_DIR[direction]+'deg)"><use href="#icon-arrow"></use></svg>';
  }
  function renderCross(cellIndex){
    cellEls[cellIndex].innerHTML = '<svg class="icon-cross"><use href="#icon-cross"></use></svg>';
  }

  function showOverlay(html){
    els.overlay.innerHTML = html;
    els.overlay.style.display = "flex";
  }
  function hideOverlay(){
    els.overlay.style.display = "none";
  }
  function setBanner(text, showClose){
    els.instructionText.textContent = text || "";
    els.instructionBanner.classList.toggle("visible", !!text);
    els.closeTestBtn.hidden = !showClose;
  }
  function showStatusBar(show){
    els.statusBar.hidden = !show;
  }
  function updateStatus(trial, total){
    els.statusProgress.textContent = trial + " / " + total;
  }
  function updateErrorDisplay(){
    els.statusErrors.textContent = "Fehler: " + run.liveFehler;
  }
  function logEvent(entry){
    run.trialLog.push(entry);
    if (entry.type === "Fehler"){
      run.liveFehler++;
      updateErrorDisplay();
    }
  }

  /* ============ Navigation ============ */
  document.querySelectorAll(".nav-btn[data-test]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      abortCurrentRun();
      showResults(false);
      document.querySelectorAll(".nav-btn[data-test]").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      showTestIntro(Number(btn.dataset.test));
    });
  });
  document.getElementById("btn-results").addEventListener("click", ()=>{
    abortCurrentRun();
    document.querySelectorAll(".nav-btn[data-test]").forEach(b=>b.classList.remove("active"));
    showResults(true);
  });
  els.closeTestBtn.addEventListener("click", ()=>{
    if (confirm("Test abbrechen? Der Fortschritt des aktuellen Durchgangs geht verloren.")){
      abortCurrentRun();
      showTestIntro(run.testId);
    }
  });

  function showResults(show){
    els.resultsView.hidden = !show;
    els.stage.style.display = show ? "none" : "flex";
    els.instructionBanner.classList.remove("visible");
    if (show) renderResultsTable();
  }

  function abortCurrentRun(){
    run.aborted = true;
    clearTimers();
    run.onKey = null;
    showStatusBar(false);
    if (typeof run.resolveCurrent === "function"){
      const r = run.resolveCurrent;
      run.resolveCurrent = null;
      r();
    }
  }

  function showTestIntro(testId){
    run.testId = testId;
    const meta = TEST_META[testId];
    clearGrid();
    setBanner("", false);
    showStatusBar(false);
    showOverlay(
      '<div class="overlay-content">'+
      '<h2>'+meta.name+'</h2>'+
      '<p>'+meta.intro+'</p>'+
      '<div class="trials-config">'+
        '<label for="trialsInput">Anzahl der Aufgaben</label>'+
        '<div class="stepper">'+
          '<input type="number" id="trialsInput" min="1" max="500" value="'+trialsConfig[testId]+'">'+
          '<div class="stepper-buttons">'+
            '<button type="button" id="trialsUpBtn" aria-label="Erhöhen">&#9650;</button>'+
            '<button type="button" id="trialsDownBtn" aria-label="Verringern">&#9660;</button>'+
          '</div>'+
        '</div>'+
      '</div>'+
      '<button class="btn" id="startTestBtn">Test starten</button>'+
      '</div>'
    );
    const trialsInput = document.getElementById("trialsInput");
    document.getElementById("trialsUpBtn").addEventListener("click", ()=>{
      const v = (parseInt(trialsInput.value, 10) || 0) + 1;
      trialsInput.value = Math.max(1, v);
    });
    document.getElementById("trialsDownBtn").addEventListener("click", ()=>{
      const v = (parseInt(trialsInput.value, 10) || 1) - 1;
      trialsInput.value = Math.max(1, v);
    });
    document.getElementById("startTestBtn").addEventListener("click", ()=>{
      let v = parseInt(trialsInput.value, 10);
      if (!v || v < 1) v = 1;
      trialsConfig[testId] = v;
      saveTrialsConfig();
      startTest(testId);
    });
  }

  async function startTest(testId){
    run.aborted = false;
    run.trialLog = [];
    run.liveFehler = 0;
    const total = trialsConfig[testId];
    run.totalTrials = total;
    hideOverlay();
    setBanner(TEST_META[testId].instruction, true);
    clearGrid();
    await runCountdown();
    if (run.aborted) return;
    showStatusBar(true);
    updateStatus(0, total);
    updateErrorDisplay();
    if (testId === 1) await runAlertnessTest(total);
    else if (testId === 2) await runSelectiveTest(total);
    else if (testId === 3) await runDividedTest(total);
    run.resolveCurrent = null;
    showStatusBar(false);
    if (run.aborted) return;
    finishRun(testId);
  }

  function runCountdown(){
    return new Promise((resolve)=>{
      const seq = ["3","2","1","Los!"];
      let i = 0;
      function step(){
        if (run.aborted){ resolve(); return; }
        if (i >= seq.length){ hideOverlay(); resolve(); return; }
        showOverlay('<div class="overlay-content"><div class="countdown-number">'+seq[i]+'</div></div>');
        i++;
        after(700, step);
      }
      step();
    });
  }

  /* ============ Test 1: Intrinsische Alertness ============ */
  function runAlertnessTest(total){
    return new Promise((resolve)=>{
      run.resolveCurrent = resolve;
      let trial = 0;

      function nextTrial(){
        if (run.aborted){ resolve(); return; }
        if (trial >= total){ resolve(); return; }
        trial++;
        updateStatus(trial, total);
        clearGrid();

        // Pro Aufgabe wird genau eine Reaktion erwartet -> genau ein Ergebnis pro Aufgabe.
        let settled = false;
        function settle(entry, pause){
          if (settled || run.aborted) return;
          settled = true;
          logEvent(entry);
          clearGrid();
          run.onKey = null;
          after(pause, nextTrial);
        }

        // Wartephase 1-3 s: ein Tastendruck hier beendet die Aufgabe als Fehler
        const isi = randInt(1000, 3000);
        run.onKey = function(){
          settle({trial:trial, type:"Fehler", info:"verfrüht", rt:null}, 1000);
        };

        after(isi, ()=>{
          if (run.aborted || settled) return;
          renderArrow(CENTER_CELL, "down");
          const onset = now();
          run.onKey = function(key, t){
            if (key === "ArrowDown"){
              settle({trial:trial, type:"Treffer", info:"korrekt", rt:Math.round(t-onset)}, 50);
            } else {
              settle({trial:trial, type:"Fehler", info:"falsche Taste", rt:Math.round(t-onset)}, 50);
            }
          };
          after(4000, ()=>{
            settle({trial:trial, type:"Auslassung", info:"keine Reaktion", rt:null}, 50);
          });
        });
      }
      nextTrial();
    });
  }

  /* ============ Test 2: Selektive Aufmerksamkeit ============ */
  function runSelectiveTest(total){
    return new Promise((resolve)=>{
      run.resolveCurrent = resolve;
      let trial = 0;
      const goFlags = buildGoSequence(total);

      function nextTrial(){
        if (run.aborted){ resolve(); return; }
        if (trial >= total){ resolve(); return; }
        trial++;
        updateStatus(trial, total);
        clearGrid();

        const isGo = goFlags[trial-1];
        const [cellA, cellB] = twoDistinctCells();
        const [dirA, dirB] = arrowPairForCondition(isGo);
        renderArrow(cellA, dirA);
        renderArrow(cellB, dirB);

        const onset = now();
        let firstHandled = false;
        let extraLogged = false;

        run.onKey = function(key, t){
          if (key !== "ArrowDown") return; // nur "unten" ist die relevante Taste
          if (!firstHandled){
            firstHandled = true;
            if (isGo){
              logEvent({trial:trial, type:"Treffer", info:"korrekt (Go)", rt:Math.round(t-onset)});
            } else {
              logEvent({trial:trial, type:"Fehler", info:"Falscher Alarm (NoGo)", rt:Math.round(t-onset)});
            }
          } else if (!extraLogged){
            // Mehrfachdruck zaehlt als genau ein zusaetzlicher Fehler pro Aufgabe
            extraLogged = true;
            logEvent({trial:trial, type:"Fehler", info:"Mehrfachdruck", rt:Math.round(t-onset)});
          }
        };

        after(2000, ()=>{
          if (run.aborted) return;
          if (!firstHandled){
            if (isGo){
              logEvent({trial:trial, type:"Auslassung", info:"keine Reaktion (Go)", rt:null});
            } else {
              logEvent({trial:trial, type:"KorrekteUnterlassung", info:"korrekt (NoGo)", rt:null});
            }
          }
          clearGrid();
          run.onKey = null;
          after(randInt(1000, 2000), nextTrial);
        });
      }
      nextTrial();
    });
  }

  /* ============ Test 3: Verteilte Aufmerksamkeit A ============ */
  function runDividedTest(total){
    return new Promise((resolve)=>{
      run.resolveCurrent = resolve;
      const EDGE_CELLS = Object.keys(SIDE_MID_CELLS).map(Number);
      let trial = 0;

      function nextTrial(){
        if (run.aborted){ resolve(); return; }
        if (trial >= total){ resolve(); return; }
        trial++;
        updateStatus(trial, total);
        clearGrid();

        // Pfeil und Kreuz stehen beide am Bildschirmrand (Mitte einer der vier Seiten).
        // Beim Pfeil ist nur die Richtung relevant, beim Kreuz nur die Position.
        const crossCell = randChoice(EDGE_CELLS);
        const crossSide = SIDE_MID_CELLS[crossCell];
        const arrowCell = randChoice(EDGE_CELLS.filter(c=>c!==crossCell));
        const arrowDir = randomDirection();

        renderArrow(arrowCell, arrowDir);
        renderCross(crossCell);

        const onset = now();
        let inputIndex = 0; // 0 = erwarte Pfeilrichtung, 1 = erwarte Kreuzposition, 2 = fertig
        let t1 = onset;
        let finished = false;

        function finalize(){
          if (finished || run.aborted) return;
          finished = true;
          if (inputIndex === 0){
            logEvent({trial:trial, type:"Auslassung", info:"Pfeil nicht beantwortet", rt:null});
            logEvent({trial:trial, type:"Auslassung", info:"Kreuz nicht beantwortet", rt:null});
          } else if (inputIndex === 1){
            logEvent({trial:trial, type:"Auslassung", info:"Kreuz nicht beantwortet", rt:null});
          }
          clearGrid();
          run.onKey = null;
          after(randInt(1000, 2000), nextTrial);
        }

        run.onKey = function(key, t){
          if (finished) return;
          if (inputIndex === 0){
            const correct = (key === KEY_FOR_DIR[arrowDir]);
            logEvent({trial:trial, type: correct ? "Treffer" : "Fehler", info:"Pfeilrichtung", rt:Math.round(t-onset)});
            t1 = t;
            inputIndex = 1;
          } else if (inputIndex === 1){
            const correct = (key === KEY_FOR_DIR[crossSide]);
            logEvent({trial:trial, type: correct ? "Treffer" : "Fehler", info:"Kreuzposition", rt:Math.round(t-t1)});
            inputIndex = 2;
            finalize();
          }
        };

        after(3500, finalize);
      }
      nextTrial();
    });
  }

  /* ============ Auswertung & Speicherung ============ */
  function rtScore(testId, meanRt){
    if (meanRt == null) return 0;
    const b = RT_BOUNDS[testId];
    if (meanRt <= b.fast) return 100;
    if (meanRt >= b.slow) return 0;
    return Math.round((b.slow - meanRt) / (b.slow - b.fast) * 1000) / 10;
  }
  function round1(x){ return Math.round(x*10)/10; }

  function computeSummary(testId, log, total){
    const meta = TEST_META[testId];
    let treffer=0, fehler=0, auslassungen=0, korrekteUnterlassungen=0, falschalarme=0;
    const rts = [];

    log.forEach(e=>{
      if (e.type==="Treffer"){
        treffer++;
        if (e.rt!=null) rts.push(e.rt);
      } else if (e.type==="Fehler"){
        fehler++;
        if (e.info && e.info.indexOf("Falscher Alarm")===0) falschalarme++;
        // In Test 3 fliessen laut Testbeschreibung alle Einzelreaktionszeiten ein
        if (testId===3 && e.rt!=null) rts.push(e.rt);
      } else if (e.type==="Auslassung"){
        auslassungen++;
      } else if (e.type==="KorrekteUnterlassung"){
        korrekteUnterlassungen++;
      }
    });

    // Bewertete Einheiten: Test 1 und 2 eine je Aufgabe, Test 3 zwei Eingaben je Aufgabe
    const bewertet = (testId===3) ? total*2 : total;
    const korrekt = treffer + korrekteUnterlassungen;
    const genauigkeit = bewertet ? (korrekt/bewertet*100) : 0;

    // Zusatzkennwert Test 2: Trefferquote nur ueber die Go-Aufgaben
    const goAufgaben = treffer + auslassungen;
    const trefferquoteGo = (testId===2 && goAufgaben) ? round1(treffer/goAufgaben*100) : null;

    const mittlereRT = rts.length ? Math.round(rts.reduce((a,b)=>a+b,0)/rts.length) : null;
    const tempowert = rtScore(testId, mittlereRT);
    // Gesamtergebnis: Genauigkeit und Schnelligkeit zu gleichen Teilen
    const gesamtwert = round1(genauigkeit*0.5 + tempowert*0.5);

    return {
      testId: testId,
      testName: meta.name,
      date: new Date().toISOString(),
      aufgaben: total,
      bewerteteEinheiten: bewertet,
      totalAufgaben: total,          // Kompatibilitaet mit aelteren Datensaetzen
      treffer: treffer,
      fehler: fehler,
      auslassungen: auslassungen,
      korrekteUnterlassungen: korrekteUnterlassungen,
      falschalarme: falschalarme,
      trefferquoteGo: trefferquoteGo,
      genauigkeit: round1(genauigkeit),
      mittlereRT: mittlereRT,
      tempowert: tempowert,
      gesamtwert: gesamtwert,
      tempoInterpretierbar: genauigkeit >= FEHLERTOLERANZ_GENAUIGKEIT,
      details: log
    };
  }

  function finishRun(testId){
    const summary = computeSummary(testId, run.trialLog, run.totalTrials);
    saveResult(summary);
    setBanner("", false);
    showStatusBar(false);
    clearGrid();
    showOverlay(
      '<div class="overlay-content">'+
      '<h2>Ergebnis: '+summary.testName+'</h2>'+
      '<div class="score-box"><b>'+summary.gesamtwert+'</b><span>Gesamtwert (0–100)</span></div>'+
      '<div class="summary-stats">'+
        '<div><b>'+summary.treffer+'</b><span>Treffer</span></div>'+
        '<div><b>'+summary.fehler+'</b><span>Fehler</span></div>'+
        '<div><b>'+summary.auslassungen+'</b><span>Auslassungen</span></div>'+
        '<div><b>'+summary.genauigkeit+' %</b><span>Genauigkeit ('+summary.bewerteteEinheiten+' bewertete Einheiten)</span></div>'+
        '<div><b>'+(summary.mittlereRT!=null ? summary.mittlereRT+' ms' : '–')+'</b><span>Ø Reaktionszeit (Tempowert '+summary.tempowert+')</span></div>'+
        '<div><b>'+summary.aufgaben+'</b><span>Aufgaben gesamt</span></div>'+
      '</div>'+
      (summary.trefferquoteGo!=null ? '<p class="sub-note">Trefferquote Go-Aufgaben: '+summary.trefferquoteGo+' % · Falschalarme: '+summary.falschalarme+'</p>' : '')+
      (summary.tempoInterpretierbar ? '' : '<p class="warn-note">Fehleranzahl über der Toleranzgrenze – die Schnelligkeitsleistung ist nur eingeschränkt interpretierbar.</p>')+
      '<button class="btn" id="repeatTestBtn">Test wiederholen</button>'+
      '<button class="btn secondary" id="toResultsBtn">Zu den Ergebnissen</button>'+
      '</div>'
    );
    document.getElementById("repeatTestBtn").addEventListener("click", ()=>showTestIntro(testId));
    document.getElementById("toResultsBtn").addEventListener("click", ()=>{
      document.querySelectorAll(".nav-btn[data-test]").forEach(b=>b.classList.remove("active"));
      showResults(true);
    });
  }

  function loadResults(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveResult(summary){
    const all = loadResults();
    all.unshift(summary);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  }
  function deleteAllResults(){
    localStorage.removeItem(STORAGE_KEY);
  }

  function fmtDate(iso){
    const d = new Date(iso);
    return d.toLocaleDateString("de-DE") + " " + d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
  }

  function renderResultsTable(){
    const all = loadResults();
    els.resultsBody.innerHTML = "";
    els.noResultsMsg.hidden = all.length>0;
    all.forEach((r, idx)=>{
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>"+fmtDate(r.date)+"</td>"+
        "<td>"+r.testName+"</td>"+
        "<td>"+(r.aufgaben!=null ? r.aufgaben : r.totalAufgaben)+"</td>"+
        "<td>"+r.treffer+"</td>"+
        "<td>"+r.fehler+"</td>"+
        "<td>"+r.auslassungen+"</td>"+
        "<td>"+r.genauigkeit+" %</td>"+
        "<td>"+(r.mittlereRT!=null ? r.mittlereRT+" ms" : "–")+"</td>"+
        "<td>"+(r.gesamtwert!=null ? r.gesamtwert : "–")+"</td>"+
        "<td><button class=\"row-btn\" data-idx=\""+idx+"\">CSV</button></td>";
      els.resultsBody.appendChild(tr);
    });
    els.resultsBody.querySelectorAll(".row-btn").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        exportDetailCsv(all[Number(btn.dataset.idx)]);
      });
    });
  }

  function downloadCsv(filename, content){
    const blob = new Blob(["﻿"+content], {type:"text/csv;charset=utf-8;"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function csvEscape(v){
    if (v === null || v === undefined) return "";
    const s = String(v);
    return /[;"\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }

  function exportDetailCsv(r){
    const header = ["Aufgabe","Typ","Info","Reaktionszeit_ms"];
    const rows = r.details.map(d=>[d.trial, d.type, d.info, d.rt!=null?d.rt:""]);
    const lines = [header.join(";")].concat(rows.map(row=>row.map(csvEscape).join(";")));
    downloadCsv("corporal-plus_"+r.testId+"_"+r.date.slice(0,19).replace(/[:T]/g,"-")+".csv", lines.join("\n"));
  }

  function exportAllCsv(){
    const all = loadResults();
    const header = ["Datum","Test","Aufgaben","Treffer","Fehler","Auslassungen","Genauigkeit_%","Mittlere_RT_ms","Tempowert","Gesamtwert"];
    const rows = all.map(r=>[fmtDate(r.date), r.testName, (r.aufgaben!=null?r.aufgaben:r.totalAufgaben), r.treffer, r.fehler, r.auslassungen, r.genauigkeit, r.mittlereRT!=null?r.mittlereRT:"", r.tempowert!=null?r.tempowert:"", r.gesamtwert!=null?r.gesamtwert:""]);
    const lines = [header.join(";")].concat(rows.map(row=>row.map(csvEscape).join(";")));
    downloadCsv("corporal-plus_ergebnisse.csv", lines.join("\n"));
  }

  els.exportAllBtn.addEventListener("click", exportAllCsv);
  els.clearAllBtn.addEventListener("click", ()=>{
    if (confirm("Gesamten Ergebnisverlauf unwiderruflich löschen?")){
      deleteAllResults();
      renderResultsTable();
    }
  });

})();
</script>
